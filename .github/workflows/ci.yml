name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: install dependencies
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test --no-pub --no-coverage 2>/dev/null || true

  conflict-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check for merge conflict markers
        run: |
          conflict_files=$(git grep -l '^<<<<<<< \|^>>>>>> \|^======= $' -- ':!*.lock' -- ':!pubspec.lock' -- ':!node_modules/' -- ':!build/' -- ':!.dart_tool/' -- ':!packages/pty/' -- ':!packages/xterm/' 2>/dev/null || true)
          if [ -n "$conflict_files" ]; then
            echo "::error::Merge conflict markers found in files:"
            echo "$conflict_files"
            exit 1
          fi
